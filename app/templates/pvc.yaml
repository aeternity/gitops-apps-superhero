{{- if .Values.persistence.enabled }}
{{ $versions := .Values.versions }}
{{ $allVersions := append $versions (merge (dict "version" (default .Values.image.tag .Chart.AppVersion )) $) | compact | uniq }}
{{- range $key, $val := $allVersions }}
{{- if $val.version }}
{{- range $disk := $.Values.persistence.disks }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ printf "%s-%s" (include "app.fullname" $) $disk.name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/version: {{ $val.version }}
    app.kubernetes.io/disk: {{ $disk.name }}
  annotations:
  {{- if $disk.storageClass }}
    volume.beta.kubernetes.io/storage-class: {{ $disk.storageClass | quote }}
  {{- else }}
    volume.alpha.kubernetes.io/storage-class: default
  {{- end }}
spec:
  accessModes:
    - {{ $disk.accessMode | quote }}
  resources:
    requests:
      storage: {{ $disk.size | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
