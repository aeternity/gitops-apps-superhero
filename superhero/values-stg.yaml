app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-603-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-603"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
      - host: "pr-604-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-604"
  versions:
    - version: "pr-603"
    - version: "pr-537"
      gitSha: "7e6f51e843a286e3242ea0dcb0fec298b6826e59"
    - version: "pr-604"
      gitSha: "3263054067761e57b1adf2b8e5b42c268cf593fb"
