app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-614-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-614"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
      - host: "pr-612-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-612"
      - host: "pr-615-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-615"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
  versions:
    - version: "pr-614"
      gitSha: "3d4359a427c8e19426db8c56b3b1326627099264"
    - version: "develop"
      gitSha: "8b160b89833c2d41806824a4c281949e8182e758"
    - version: "pr-612"
      gitSha: "8b160b89833c2d41806824a4c281949e8182e758"
    - version: "pr-615"
      gitSha: "1c04a61f8c1159db4eb093eba102e74e3e40e3f7"
    - version: "pr-537"
      gitSha: "64614f3502f0c6db60045aac3c19997ef61062fa"
