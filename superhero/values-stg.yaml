app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
      - host: "pr-611-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-611"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
  versions:
    - version: "pr-537"
      gitSha: "525cf8ce4fce315bfc2a8179c6495673fe03e4db"
    - version: "pr-611"
      gitSha: "9fa091cdf9da221534ed802134711d1215e5ea20"
    - version: "develop"
      gitSha: "3e5401dc5be421f3d4cfcc5817e55d37ef5f196e"
