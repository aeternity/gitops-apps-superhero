app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-614-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-614"
      - host: "pr-618-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-618"
      - host: "pr-619-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-619"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
      - host: "pr-622-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-622"
  versions:
    - version: "pr-614"
      gitSha: "3d4359a427c8e19426db8c56b3b1326627099264"
    - version: "pr-618"
      gitSha: "d59d26a6761e66a0b0e3a0d1b364411d62f34c1d"
    - version: "pr-619"
      gitSha: "08e83c0262149624330b30c5e16c2d7f24ffd23a"
    - version: "develop"
      gitSha: "22b2fac7834792f40a9a3fce4486b918011351ac"
    - version: "pr-622"
      gitSha: "61df8f71ab22d5f593938bcdc73385a5adfc3a86"
