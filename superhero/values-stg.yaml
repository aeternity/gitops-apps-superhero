app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
      - host: "pr-463-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-463"
  versions:
    - version: "pr-537"
    - version: "pr-463"
