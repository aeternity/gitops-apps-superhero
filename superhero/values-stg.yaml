app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
      - host: "pr-602-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-602"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
      - host: "pr-607-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-607"
  versions:
    - version: "pr-537"
      gitSha: "525cf8ce4fce315bfc2a8179c6495673fe03e4db"
    - version: "pr-602"
      gitSha: "143ed0f53333d6026d28176d96daed6ed6881cc7"
    - version: "develop"
      gitSha: "8f0bb58289d00144101ad56f86614e7d2d9c2604"
    - version: "pr-607"
      gitSha: "e06e913fddd7f72c8a23381bc6594633913685c2"
