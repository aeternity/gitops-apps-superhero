app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
  versions:
    - version: "pr-537"
      gitSha: "525cf8ce4fce315bfc2a8179c6495673fe03e4db"
    - version: "develop"
      gitSha: "b50cec343deb9e16d37ee097fd86b0e3ae6540c3"
