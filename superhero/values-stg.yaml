app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-612-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-612"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
      - host: "pr-614-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-614"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
  versions:
    - version: "pr-612"
      gitSha: "13289896d4c2cfc6cdcc96b4846abc54fc004f54"
    - version: "pr-537"
      gitSha: "29ad5a45badae25ed9e5f0843343bb86d0c68f7f"
    - version: "pr-614"
      gitSha: "3d4359a427c8e19426db8c56b3b1326627099264"
    - version: "develop"
      gitSha: "8b160b89833c2d41806824a4c281949e8182e758"
