          - path: "/"
      - host: "pr-614-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-614"
      - host: "pr-618-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-618"
      - host: "pr-619-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-619"
      - host: "pr-623-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-623"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
      - host: "pr-625-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-625"
