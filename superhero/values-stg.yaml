  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "pr-601-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-601"
      - host: "pr-601-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-601"
      - host: "pr-601-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-601"
  versions:
    - version: "pr-601"
      gitSha: "f302bbb284594a5b3a7558502f130f6c7f1b5bcb"
    - version: "pr-601"
