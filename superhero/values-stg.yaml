app:
  nameOverride: "superhero"
  imagePullSecrets:
    - name: "dockerhub-secret"
  image:
    repository: "superherodotcom/sup6cga"
    tag: "develop"
    pullPolicy: "Always"
  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  ingress:
    enabled: "true"
    hosts:
      - host: "superhero.stg.service.aepps.com"
        paths:
          - path: "/"
      - host: "develop-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "develop"
      - host: "pr-537-superhero.stg.service.aepps.com"
        paths:
          - path: "/"
            version: "pr-537"
  versions:
    - version: "develop"
      gitSha: "13289896d4c2cfc6cdcc96b4846abc54fc004f54"
    - version: "pr-537"
      gitSha: "cd551d47c048f774f7fa80b25805ea7dc3e5a50a"
